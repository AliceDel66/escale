name: Escale
options:
  bundleIdPrefix: com.attila-krb
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: fr
  knownRegions:
    - fr
    - en
    - zh-Hans
  fileTypes:
    # Icone Icon Composer (Liquid Glass) : ressource, pas groupe de sources.
    icon: {file: true, buildPhase: resources}
packages:
  EscaleCore:
    path: Packages/EscaleCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Version pilotee par variables (surchargeables : xcodebuild MARKETING_VERSION=... ou scripts/release.sh --version).
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # URL du flux Sparkle (appcast). Vide par defaut : mises a jour desactivees (voir docs/RELEASE.md).
    ESCALE_FEED_URL: ""
targets:
  Escale:
    type: application
    platform: macOS
    sources: [Escale]
    dependencies:
      - package: EscaleCore
      - package: SwiftTerm
      - package: Sparkle
    # Serveur X11 integre : Contents/Helpers/EscaleX11.app, signe avec l'identite de l'app (runtime durci en Release).
    # Avant la signature de l'app par Xcode (qui scelle Contents/Helpers). Premier build : telechargement de XQuartz.
    postBuildScripts:
      - name: Serveur X11 integre
        basedOnDependencyAnalysis: false
        script: |
          rt=""; [ "${ENABLE_HARDENED_RUNTIME:-NO}" = "YES" ] && rt="--runtime"
          "$SRCROOT/scripts/x11-bundle.sh" --install "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers" \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" $rt
    info:
      path: Escale/Info.plist
      properties:
        CFBundleDisplayName: Escale
        CFBundleLocalizations:
          - fr
          - en
          - zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "$(ESCALE_FEED_URL)"
        SUPublicEDKey: "u8/2WiJsdPg8DozixHDr/1UCGjxAY9+EwziR4NHvLkg="
        SUEnableAutomaticChecks: true
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.attila-krb.Escale
        PRODUCT_NAME: Escale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Escale/Escale.entitlements
        # La phase « Serveur X11 integre » lit le cache ~/Library/Caches/Escale-build et build/x11.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Catalogue de chaines : cles = chaines francaises (langue de developpement), extraites a la compilation.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Identite Release surchargeable par l'environnement (ESCALE_SIGN_IDENTITY).
        ESCALE_SIGN_IDENTITY: D0F93EE12C167056F3206C7CB7D208C0952E9728
      configs:
        # Release : Developer ID + runtime durci. Debug reste ad hoc ('-') pour scripts/test.sh et les selftests.
        # Le hash designe un certificat precis (deux certificats de meme nom existent dans le trousseau) ;
        # scripts/release.sh le surcharge avec ESCALE_SIGN_IDENTITY.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "$(ESCALE_SIGN_IDENTITY)"
          DEVELOPMENT_TEAM: 5FMH389VS7
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  Escale:
    build:
      targets:
        Escale: all
